<style>
:root {
    --sunburst-light: #ffcc33;
    --sunburst-dark: #333;
}
.sunburst {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: fixed;
    top:0;
    background: linear-gradient(145deg, #ff6fa2 0%, #ff8fc2 35%, #ffd3e4 100%);
    isolation: isolate;
}
.sunburst::before {
    content: "";
    position: absolute;
    inset: -25%;
    background:
      repeating-linear-gradient(
        -25deg,
        rgba(255, 255, 255, 0.35) 0 28px,
        rgba(255, 111, 162, 0.06) 28px 56px
      ),
      radial-gradient(circle at 10% 15%, rgba(255,255,255,0.8), rgba(255,255,255,0) 35%),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,0.65), rgba(255,255,255,0) 40%);
    transform: rotate(-8deg) scale(1.15);
    opacity: 0.8;
    z-index: -2;
}
.sunburst img,
.sunburst .loading {
    z-index:2;
}
.lollipop-sprinkles {
    position: absolute;
    inset: -20%;
    background-image:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.85) 0 12px, transparent 13px),
      radial-gradient(circle at 38% 28%, rgba(255,255,255,0.5) 0 9px, transparent 10px),
      radial-gradient(circle at 70% 16%, rgba(255,255,255,0.65) 0 10px, transparent 11px),
      radial-gradient(circle at 86% 36%, rgba(255,255,255,0.45) 0 8px, transparent 9px),
      radial-gradient(circle at 22% 62%, rgba(255,255,255,0.55) 0 11px, transparent 12px),
      radial-gradient(circle at 56% 70%, rgba(255,255,255,0.7) 0 9px, transparent 10px),
      radial-gradient(circle at 82% 74%, rgba(255,255,255,0.5) 0 12px, transparent 13px),
      radial-gradient(circle at 12% 88%, rgba(255,255,255,0.75) 0 10px, transparent 11px);
    animation: candyDrift 28s ease-in-out infinite alternate;
    opacity: 0.9;
    z-index: -1;
}
#nftModal, #nftModal img {
    border-radius: 1.5rem !important;
}

border-radius: unset;
@keyframes candyDrift {
  from { transform: translate3d(-10px, -8px, 0) scale(1); }
  to { transform: translate3d(14px, 10px, 0) scale(1.06); }
}
@keyframes move {
  from {
    transform: translateX(100px);
    opacity: 0;
  }
  to {
    transform: translateX(0px);
    opacity: 1;
  }
}
.fa-twitter:before {

}
