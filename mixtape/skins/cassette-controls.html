<div class="progress-row">
  <span id="elapsedTime">0:00</span>
  <input id="progressInput" type="range" min="0" max="221" value="0" aria-label="Track progress" />
  <span id="durationTime">0:00</span>
</div>
<div class="deck-buttons controllers">
  <button id="prevButton" class="controllers_button rewind" type="button" aria-label="Previous track"><span></span></button>
  <button id="playButton" class="controllers_button play" type="button" aria-label="Play or pause"><span></span></button>
  <button id="nextButton" class="controllers_button forward" type="button" aria-label="Next track"><span></span></button>
</div>
