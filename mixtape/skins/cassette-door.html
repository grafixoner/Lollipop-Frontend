<div class="cassette-door-stage">
  <div class="deck-door-top-rail" aria-hidden="true"></div>
  <div class="deck-door" aria-hidden="true">
    <div class="deck-door-frame"></div>
    <div class="deck-door-window">
      <div class="door-window-cutout left"></div>
      <div class="door-window-cutout center"></div>
      <div class="door-window-cutout right"></div>
    </div>
    <div class="door-sticker door-sticker-lollipop">
      <img src="/mixtape/assets/lollipop-sticker.png" alt="Lollipop sticker" class="door-sticker-image" />
    </div>
    <button class="door-sticker door-sticker-youtube" type="button" aria-label="Toggle YouTube video">
      <div class="door-sticker-paper">
        <span class="door-sticker-powered">POWERED BY</span>
        <span class="door-sticker-youtube-mark">
          <span class="door-sticker-youtube-icon"></span>
          <span class="door-sticker-youtube-text">YouTube</span>
        </span>
      </div>
    </button>
    <div class="deck-door-lower-window" aria-hidden="true"></div>
    <div class="deck-door-handle"></div>
  </div>
</div>
