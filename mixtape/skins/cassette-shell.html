<div class="cassette-skin manz-cassette-skin">
  <div class="cassette-shell-stage">
    <div class="css-cassette">

      <div class="css-top-tape">
        <div class="arrow-mark-container"></div>
        <div class="brand-mark">Lollipop</div>
      </div>

      <div class="css-medium-tape">
        <div class="css-label-container">
          <div class="css-label">

            <div class="css-top-label">
              <div class="predefined-text">INDEX</div>
              <div class="top-text">
                <div class="mixtape-handwrite cassette-title-target"></div>
              </div>
            </div>

            <div class="css-medium-label">
              <div class="side-name cassette-side-target"></div>
              <div class="gap-container">
                <div class="gap">
                  <div class="left tapereel">
                    <div class="notch notch-1"></div>
                    <div class="notch notch-2"></div>
                    <div class="notch notch-3"></div>
                  </div>
                  <div class="central-gap">
                    <div class="left innertape"></div>
                    <div class="right innertape"></div>
                  </div>
                  <div class="right tapereel">
                    <div class="notch notch-1"></div>
                    <div class="notch notch-2"></div>
                    <div class="notch notch-3"></div>
                  </div>
                </div>
              </div>
              <div class="noise-reduction">
                NOISE REDUCTION
                <div class="box"><div>ON</div><div>OFF</div></div>
              </div>
            </div>

            <div class="css-bottom-label">
              <div class="brand-text">
                <div class="maintext">TAPPABLE</div>
                <div class="subtext">TYPE I NORMAL POSITION</div>
              </div>
              <div class="arrow-text">▶</div>
              <div class="model-text"><span>LP</span>90</div>
            </div>

          </div>
        </div>
      </div>

      <div class="css-bottom-tape">
        <div class="magnetic-container">
          <div class="magnetic-shield">
            <div class="left-hole-container">
              <div class="hole hole-1"></div>
              <div class="hole hole-2"></div>
            </div>
            <div class="right-hole-container">
              <div class="hole hole-3"></div>
              <div class="hole hole-4"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="cassette-screw screw-1"><div class="dot"></div></div>
      <div class="cassette-screw screw-2"><div class="dot"></div></div>
      <div class="cassette-screw screw-3"><div class="dot"></div></div>
      <div class="cassette-screw screw-4"><div class="dot"></div></div>
    </div>
  </div>
</div>
